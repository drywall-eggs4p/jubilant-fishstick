    <rect x="330.5" y="180.5" width="1259" height="719" rx="15.5" stroke="#2D3743" stroke-opacity=".76"/>
    <rect x="331" y="181" width="1258" height="58" rx="15" fill="#111923"/>
    <rect x="331" y="224" width="1258" height="15" fill="#111923"/>
    <path d="M330 239H1590" stroke="#26313D"/>


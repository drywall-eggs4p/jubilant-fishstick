<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <title>Neverlose Reloaded inspired main settings</title>
  <defs>
    <linearGradient id="bg" x1="240" y1="80" x2="1670" y2="1040" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091015"/><stop offset=".48" stop-color="#111922"/><stop offset="1" stop-color="#060B10"/>
    </linearGradient>
    <linearGradient id="panel" x1="390" y1="190" x2="1530" y2="890" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121A23"/><stop offset="1" stop-color="#0B1118"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#836CFF"/><stop offset="1" stop-color="#5944D8"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(960 496) rotate(90) scale(620 920)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#253548" stop-opacity=".42"/><stop offset="1" stop-color="#060B10" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="290" y="140" width="1340" height="860" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000" flood-opacity=".58"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <g id="Background">
    <rect width="1920" height="1080" fill="url(#bg)"/>
    <rect width="1920" height="1080" fill="url(#ambient)"/>
    <g opacity=".11" stroke="#9CB2C7" stroke-width="1">
      <path d="M0 182H1920M0 902H1920M210 0V1080M1710 0V1080"/>
    </g>
    <circle cx="1475" cy="160" r="240" fill="#6552FF" opacity=".035"/>
    <circle cx="390" cy="910" r="310" fill="#326E9F" opacity=".04"/>
  </g>


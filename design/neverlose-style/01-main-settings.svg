        <rect x="1230" y="614" width="308" height="42" rx="8" fill="#141E28"/><circle cx="1251" cy="635" r="8" fill="#24313D"/><text x="1268" y="639" fill="#AEB9C3">Heavy pistols</text><circle cx="1518" cy="635" r="3" fill="#44515E"/>
        <rect x="1230" y="664" width="308" height="42" rx="8" fill="#141E28"/><circle cx="1251" cy="685" r="8" fill="#24313D"/><text x="1268" y="689" fill="#AEB9C3">Pistols</text><circle cx="1518" cy="685" r="3" fill="#44515E"/>

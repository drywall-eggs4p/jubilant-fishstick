        <rect x="1230" y="772" width="308" height="44" rx="9" fill="#7965F2" fill-opacity=".12" stroke="#7965F2" stroke-opacity=".4"/><path d="M1250 794H1262M1256 788V800" stroke="#A99EFF" stroke-width="1.5" stroke-linecap="round"/><text x="1274" y="798" fill="#BDB5FF" font-weight="600">Create preset</text>

  <text x="1180" y="404" fill="#637382" font-size="9" font-weight="700" letter-spacing="1.2">SPACING</text>
  <g fill="#7965F2"><rect x="1180" y="425" width="8" height="8" rx="2"/><rect x="1180" y="449" width="16" height="8" rx="2"/><rect x="1180" y="473" width="24" height="8" rx="2"/><rect x="1180" y="497" width="32" height="8" rx="2"/><rect x="1180" y="521" width="48" height="8" rx="2"/></g><g fill="#81909D" font-size="9"><text x="1244" y="433">8 px · base unit</text><text x="1244" y="457">16 px · compact gap</text><text x="1244" y="481">24 px · card padding</text><text x="1244" y="505">32 px · section gap</text><text x="1244" y="529">48 px · screen gap</text></g>

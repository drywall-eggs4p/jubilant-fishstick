  <rect x="1160" y="768" width="376" height="296" rx="14" fill="#0D151D" stroke="#27323D"/>
  <text x="1180" y="802" fill="#D3DAE0" font-size="11" font-weight="600">Compact, technical, restrained</text>
  <g fill="#82909D" font-size="10"><circle cx="1184" cy="834" r="3" fill="#7965F2"/><text x="1196" y="838">Use 1 px cool-gray borders</text><circle cx="1184" cy="866" r="3" fill="#7965F2"/><text x="1196" y="870">Keep accent usage under 15%</text><circle cx="1184" cy="898" r="3" fill="#7965F2"/><text x="1196" y="902">Prefer 9–12 px interface labels</text><circle cx="1184" cy="930" r="3" fill="#7965F2"/><text x="1196" y="934">Use soft shadow only for floating HUD</text><circle cx="1184" cy="962" r="3" fill="#7965F2"/><text x="1196" y="966">Separate groups with low-contrast rules</text></g>
  <rect x="1180" y="994" width="336" height="48" rx="10" fill="#7965F2" fill-opacity=".1" stroke="#7965F2" stroke-opacity=".36"/><text x="1196" y="1015" fill="#A99EFF" font-size="9" font-weight="650">ACCENT RULE</text><text x="1196" y="1031" fill="#736B9B" font-size="9">Reserve violet for active and interactive states.</text>
</g>
